name: Guardian CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: guardian_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d guardian_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/guardian_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/guardian_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/guardian_test
      NODE_ENV: test
      APP_ENV: test
      LOG_LEVEL: error
      CRON_SECRET: ci-test-cron-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit/API tests
        # Integration suites are run explicitly after migrations below.
        run: env -u DATABASE_URL -u DIRECT_URL -u TEST_DATABASE_URL npm test

      - name: Apply database migrations
        run: npm run db:deploy

      - name: Live PostgreSQL integration gates
        run: npm run test:integration

      - name: Production build
        run: npm run build

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Keep this job least-privilege: scan and fail on leaks without
          # uploading SARIF or commenting on pull requests.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_COMMENTS: "false"
